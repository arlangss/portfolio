<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LangsKuy Market</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            🛍️ LangsKuy
        </div>

        <div class="cart">
            🛒 <span id="cart-count">0</span>
        </div>

    </nav>


    <!-- SEARCH -->
    <section class="search-box">

        <input
            type="text"
            id="search"
            placeholder="🔍 Cari produk..."
        >

    </section>


    <!-- KATEGORI -->
    <section class="category">

        <h2>Kategori</h2>

        <div class="category-list">

            <button>👕 Fashion</button>
            <button>📱 Elektronik</button>
            <button>🎮 Gaming</button>
            <button>💻 Laptop</button>

        </div>

    </section>


    <!-- PRODUK -->
    <section class="products">

        <div class="section-title">

            <h2>Produk Terbaru</h2>

            <a href="#">Lihat Semua</a>

        </div>


        <div class="product-grid">


            <!-- PRODUK 1 -->
            <div class="product">

                <div class="product-image">
                    👕
                </div>

                <div class="product-info">

                    <h3>Kaos Oversize</h3>

                    <p class="price">
                        Rp50.000
                    </p>

                    <p class="location">
                        📍 Bekasi
                    </p>

                    <button
                        onclick="addToCart()"
                        class="buy-button">

                        + Keranjang

                    </button>

                </div>

            </div>


            <!-- PRODUK 2 -->
            <div class="product">

                <div class="product-image">
                    🎧
                </div>

                <div class="product-info">

                    <h3>Headset Gaming</h3>

                    <p class="price">
                        Rp120.000
                    </p>

                    <p class="location">
                        📍 Jakarta
                    </p>

                    <button
                        onclick="addToCart()"
                        class="buy-button">

                        + Keranjang

                    </button>

                </div>

            </div>


            <!-- PRODUK 3 -->
            <div class="product">

                <div class="product-image">
                    🎮
                </div>

                <div class="product-info">

                    <h3>Game Controller</h3>

                    <p class="price">
                        Rp150.000
                    </p>

                    <p class="location">
                        📍 Bandung
                    </p>

                    <button
                        onclick="addToCart()"
                        class="buy-button">

                        + Keranjang

                    </button>

                </div>

            </div>


            <!-- PRODUK 4 -->
            <div class="product">

                <div class="product-image">
                    📱
                </div>

                <div class="product-info">

                    <h3>Smartphone</h3>

                    <p class="price">
                        Rp1.500.000
                    </p>

                    <p class="location">
                        📍 Cikarang
                    </p>

                    <button
                        onclick="addToCart()"
                        class="buy-button">

                        + Keranjang

                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">

        <a href="#">
            🏠
            <span>Home</span>
        </a>

        <a href="#">
            🔍
            <span>Cari</span>
        </a>

        <a href="#">
            🛒
            <span>Keranjang</span>
        </a>

        <a href="#">
            👤
            <span>Akun</span>
        </a>

    </div>


    <script src="script.js"></script>

</body>
</html>
